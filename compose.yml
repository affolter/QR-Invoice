name: qrcode

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
    volumes:
      - ./deploy/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - qrcode

  frontend:
    image: ${QR_IMAGE:-qr-invoice:deploy}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /run
      - /tmp
    networks:
      - qrcode

networks:
  qrcode:
    driver: bridge
